name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ## ── Governance — review infrastructure health ────────────────────
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Verify review infrastructure exists (PR_EVIDENCE.md references)
      - name: Review governance check
        run: |
          set -euo pipefail
          FAIL=0
          for f in .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS .github/PR_EVIDENCE.md .github/REVIEW.md CONTRIBUTING.md; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f — review infrastructure incomplete"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 1 ] && exit 1
          echo "✅ Review governance: all infrastructure files present"

  ## ── Static audit — fast, no build ───────────────────────────────
  audit:
    name: Static Audit
    runs-on: macos-26
    timeout-minutes: 15
    needs: [governance]
    steps:
      - uses: actions/checkout@v4

      - name: Setup SwiftLint
        run: |
          brew install swiftlint
          # Version lock (mlx-swift-lm lesson: "a new release can change
          # formatting rules and reformat files no PR touched"). If brew ever
          # ships a newer SwiftLint, fail loudly instead of silently
          # re-scoring the baseline.
          SWIFTLINT_VERSION="$(swiftlint version 2>/dev/null | tr -d '[:space:]')"
          if [ "$SWIFTLINT_VERSION" != "0.65.0" ]; then
            echo "❌ SwiftLint $SWIFTLINT_VERSION != pinned 0.65.0 — bump this pin deliberately (with a re-lint), never silently."
            exit 1
          fi
          echo "✅ SwiftLint pinned: $SWIFTLINT_VERSION"

      - name: Setup swift-format
        run: |
          brew install swift-format
          # Same version-lock pattern. swift-format 603.0.0 is the release
          # whose format output this codebase conforms to.
          SF="$(swift-format --version 2>&1 | head -1)"
          case "$SF" in
            *603.0.0*) echo "✅ swift-format pinned: $SF" ;;
            *) echo "❌ swift-format not 603.0.0 (got: $SF) — bump deliberately with a reformat." ; exit 1 ;;
          esac

      # Pattern-based static audit (whitelist-protected)
      - name: Run static audit
        run: bash scripts/audit.swift_patterns.sh

      # Format gate — mlx-swift-lm pattern (pre-commit run --all, swift-format
      # format hook). Run swift-format in-place then require zero diff: any
      # file that would be reformatted fails the pipeline.
      - name: Swift-format gate
        run: |
          set -euo pipefail
          swift-format format --in-place --recursive --parallel --configuration .swift-format Sources/ Tests/
          if ! git diff --exit-code -- Sources/ Tests/ > /tmp/format-diff.txt 2>&1; then
            echo "❌ swift-format reformatted files (see diff) — run locally:"
            echo "   swift-format format --in-place --recursive --configuration .swift-format Sources/ Tests/ && git add -A"
            git --no-pager diff --stat -- Sources/ Tests/ || true
            head -40 /tmp/format-diff.txt || true
            exit 1
          fi
          echo "✅ swift-format gate: zero files reformatted"

      # Full lint report — advisory only (style errors expected)
      - name: Run SwiftLint (report)
        run: |
          set -euo pipefail
          swiftlint lint --config .swiftlint.yml 2>&1 | tee /tmp/swiftlint-full.txt || true
          ERRORS=$(grep -c 'error:' /tmp/swiftlint-full.txt || true)
          WARNINGS=$(grep -c 'warning:' /tmp/swiftlint-full.txt || true)
          echo ""
          echo "📊 SwiftLint report: $ERRORS errors, $WARNINGS warnings"

      # Crash-risk rules MUST be zero in Sources/
      - name: SwiftLint crash-risk gate (Sources/)
        run: |
          set -euo pipefail
          swiftlint lint --config .swiftlint.yml Sources/ 2>&1 \
            | tee /tmp/swiftlint-sources.txt || true
          # swiftlint output line format: "path:ln:col: warning: Human Name (rule_id)"
          # — severity BEFORE the human name; rule id is the LAST token in parens.
          # Match BOTH severities: force_unwrapping / implicitly_unwrapped_optional
          # ride at warning; fatal_error_message / empty_count ride at error.
          FU=$(grep -cE '(warning|error):.*Force Unwrapping' /tmp/swiftlint-sources.txt || true)
          IU=$(grep -cE '(warning|error):.*Implicitly Unwrapped Optional' /tmp/swiftlint-sources.txt || true)
          FE=$(grep -cE '(warning|error):.*Fatal Error Message' /tmp/swiftlint-sources.txt || true)
          EC=$(grep -cE '(warning|error):.*Empty Count' /tmp/swiftlint-sources.txt || true)
          echo "force_unwrapping=$FU  implicitly_unwrapped=$IU  fatalError=$FE  empty_count=$EC"
          FAIL=0
          [ "$FU" -gt 0 ] && echo "BLOCKED: force_unwrapping in Sources/" && FAIL=1
          [ "$IU" -gt 0 ] && echo "BLOCKED: implicitly_unwrapped_optional in Sources/" && FAIL=1
          [ "$FE" -gt 0 ] && echo "BLOCKED: fatalError without message in Sources/" && FAIL=1
          [ "$EC" -gt 0 ] && echo "BLOCKED: empty_count in Sources/" && FAIL=1
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "OK: crash-risk rules clean in Sources/"

      # Secret scanning — detect hardcoded keys, tokens, passwords in the diff
      # Source: references/zeroclaw/.githooks/pre-commit + gitleaks.toml
      - name: Setup gitleaks
        run: brew install gitleaks

      - name: Secret scanning (diff scan)
        run: |
          set -euo pipefail
          # In PR context, scan the diff between HEAD and base branch
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch origin +refs/heads/${GITHUB_BASE_REF}:
            gitleaks detect --source "$(git diff origin/${GITHUB_BASE_REF})" --verbose || {
              echo "❌ Secret detected in changes — pipeline blocked"
              exit 1
            }
          else
            # Fallback: scan staged content or current files
            gitleaks detect --source "." --verbose --no-git || {
              echo "❌ Secret detected — pipeline blocked"
              exit 1
            }
          fi
          echo "✅ Secret scan: clean"

      - name: Test coverage report (advisory)
        run: |
          set -euo pipefail
          python3 scripts/coverage_report.py 2>&1 || {
            echo "ℹ️ Coverage data not available (xcodebuild runner uses build-for-testing, not swift test --enable-code-coverage)"
            echo "ℹ️ Coverage gate skipped — advisory only"
          }

  ## ── Build + test via xcodebuild (mlx-swift-lm pattern) ──
  # xcodebuild handles Metal shader compilation natively (resolves metallib).
  # mlx-swift-lm CI uses: xcodebuild build-for-testing → xcrun xctest.
  # This avoids the swift test metallib path issue entirely.
  build-and-test:
    name: "Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            build_release: true
          - os: xcode-27
            build_release: true
    continue-on-error: ${{ matrix.os == 'xcode-27' && true }}
    steps:
      - uses: actions/checkout@v4

      # SPM dependency cache — repos only, not build output (avoid stale artifacts)
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/repositories
            .build/checkouts
          key: spm-deps-${{ matrix.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-deps-${{ matrix.os }}-

      # macos-26: build-for-testing already runs tests (TEST BUILD SUCCEEDED)
      # xcode-27: requires MetalToolchain — install before build

      - name: Install MetalToolchain (xcode-27)
        if: ${{ matrix.os == 'xcode-27' }}
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Build for testing (xcodebuild)
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          xcodebuild build-for-testing \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreai \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES
        env:
          OCOREAI_BUILD: ci

      # ── Release build via xcodebuild ──
      - name: Build (xcodebuild, Release)
        if: ${{ matrix.build_release == true }}
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          xcodebuild build \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreai \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES
        env:
          OCOREAI_BUILD: ci

      - name: Collect artifacts (Release)
        if: ${{ matrix.build_release == true && always() }}
        run: |
          set -euo pipefail
          DD=~/Library/Developer/Xcode/DerivedData/ocoreai-*/Build/Products
          PRODUCT_DIR=$(find "$DD" -path '*/Release*' -type d 2>/dev/null | head -1)
          if [ -z "$PRODUCT_DIR" ]; then
            echo "🔍 Scanning DerivedData for release products..."
            PRODUCT_DIR=$(find "$DD" -name 'ocoreai' -type f 2>/dev/null | head -1 | xargs dirname)
          fi
          echo "PRODUCT_DIR=$PRODUCT_DIR"
          mkdir -p .artifacts/release
          [ -f "$PRODUCT_DIR/ocoreai" ] && cp "$PRODUCT_DIR/ocoreai" .artifacts/release/
          [ -d "$PRODUCT_DIR/mlx-swift_Cmlx.bundle" ] && cp -R "$PRODUCT_DIR/mlx-swift_Cmlx.bundle" .artifacts/release/
          ls -la .artifacts/release/
        continue-on-error: true

      - name: Upload build artifacts
        if: ${{ matrix.build_release == true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ocoreai-binary-${{ matrix.os }}
          path: .artifacts/release/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test diagnostics
        if: ${{ matrix.run_tests == true && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 7

  ## ── Release (tagged pushes only) ────────────────────────────────
  # Uses artifacts from both macos-26 and xcode-27 runners.
  release:
    name: Release
    runs-on: macos-26
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts (macOS 26)
        uses: actions/download-artifact@v4
        with:
          name: ocoreai-binary-macos-26
          path: .build/out/Products/Release/

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG -> Version: $VERSION"

      - name: Verify release prerequisites
        run: |
          set -euo pipefail
          echo "📦 Verifying release prerequisites..."
          if [ ! -f ".build/out/Products/Release/ocoreai" ]; then
            echo "❌ Release binary not found"
            exit 1
          fi
          echo "✅ Binary OK"
          if [ ! -f "PrivacyInfo.xcprivacy" ]; then
            echo "❌ PrivacyInfo.xcprivacy missing — block release"
            exit 1
          fi
          echo "✅ PrivacyInfo.xcprivacy OK"

      - name: Package macOS App
        run: |
          set -euo pipefail
          APP_DIR="ocoreai.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp .build/out/Products/Release/ocoreai "$APP_DIR/MacOS/"
          cp -R .build/out/Products/Release/mlx-swift_Cmlx.bundle \
              "$APP_DIR/MacOS/" \
              2>/dev/null || echo "⚠️ No MLX bundle"
          cp PrivacyInfo.xcprivacy "$APP_DIR/Resources/"

          python3 -c "
          import xml.etree.ElementTree as ET
          version = '${{ steps.version.outputs.version }}'
          root = ET.Element('plist', version='1.0')
          d = ET.SubElement(root, 'dict')
          items = [
            ('CFBundleExecutable', 'ocoreai'),
            ('CFBundleIdentifier', 'com.uingei.ocoreai'),
            ('CFBundleName', 'ocoreai'),
            ('CFBundleShortVersionString', version),
            ('CFBundleVersion', version),
            ('LSMinimumSystemVersion', '15.0'),
            ('NSHighResolutionCapable', 'true'),
            ('LSRequiresIPhoneOS', 'false'),
            ('NSCameraUsageDescription',
             'Camera access for multimodal AI vision input.'),
            ('NSMicrophoneUsageDescription',
             'Microphone access for voice input (STT).'),
          ]
          for k, v in items:
              ET.SubElement(d, 'key').text = k
              ET.SubElement(d, 'string').text = v
          tree = ET.ElementTree(root)
          plist = '$APP_DIR/Info.plist'
          with open(plist, 'wb') as f:
              f.write(b'<?xml version="1.0" encoding="UTF-8"?>\\n')
              f.write(b'<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
                      b'"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\\n')
              tree.write(f, encoding='UTF-8', xml_declaration=False)
          "

      - name: Ad-hoc codesign
        run: |
          set -euo pipefail
          codesign --sign - --force --deep --options runtime ocoreai.app
          codesign -vvv --strict ocoreai.app
          echo "✅ Codesign verified"

      - name: Archive builds
        run: |
          set -euo pipefail
          tar czf ocoreai-macos.tar.gz ocoreai.app
          shasum -a 256 ocoreai-macos.tar.gz > SHA256.txt
          echo "📦 $(du -h ocoreai-macos.tar.gz | awk '{print $1}')"
          echo "🔖 $(cat SHA256.txt)"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ocoreai-macos.tar.gz
            SHA256.txt
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
