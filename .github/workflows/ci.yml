name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

# A push supersedes the push before it on the same ref. The wording copied here for years said the
# semantics were codex's, and they were: codex/.github/workflows/bazel.yml:13 appends the run id for
# `main` so nothing on main is ever cancelled, and this file pasted that expression. Deliberate
# divergence, with the number that caused it: eleven pushes to main on 10-28 left five runs in flight
# at once, four arm64 legs apiece, and the authority leg for HEAD waited over an hour behind verdicts
# for commits HEAD already contains. codex pays that price in one workflow out of seven and this repo
# has no per-commit artefact to buy with it; coreai-models/.github/workflows/ci.yml:9 and
# opencode/.github/workflows/check.yml:12 both group per ref and cancel, the latter reserving the
# run-id group for a release branch whose every commit owes a quarantine artefact.
# What is not lost: every push still gets its own run row with its SHA, and a cancelled leg never
# reads green — scripts/ci-status.sh maps `cancelled` to exit 1, "AUTHORITY NOT GREEN". A tag push
# keeps its own group (`v0.1.14`), so no push to main can cancel a release run.
concurrency:
  group: ocoreai-ci::${{ github.event.pull_request.number > 0 && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

jobs:
  ## ── Governance — review infrastructure health ────────────────────
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Verify review infrastructure exists (PR_EVIDENCE.md references), including the intake side:
      # a stranger's bug report is the cheapest contribution there is, and a form that GitHub refuses
      # to render (empty description, malformed body) silently costs every one of them.
      - name: Review governance check
        run: |
          set -euo pipefail
          FAIL=0
          for f in .github/PULL_REQUEST_TEMPLATE.md .github/CODEOWNERS .github/PR_EVIDENCE.md .github/REVIEW.md CONTRIBUTING.md \
                   .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yml \
                   .github/ISSUE_TEMPLATE/capability_honesty.yml .github/ISSUE_TEMPLATE/feature_request.yml; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing: $f — review infrastructure incomplete"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 1 ] && exit 1
          echo "✅ Review governance: all infrastructure files present (contribution + intake)"

      # Text gates belong on the free runner: the macos-26 audit leg costs 715 s a push, and
      # neither of these needs a Swift toolchain. codespell's pin lives in the script (one home),
      # so the workflow installs exactly what the gate asserts. setup-python first because the
      # runner's system python is PEP 668 externally-managed and refuses `pip install`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spell gate
        run: |
          set -euo pipefail
          PIN="$(sed -n 's/^PIN=\([0-9.]*\)$/\1/p' scripts/spell-check.sh)"
          python3 -m pip install --quiet "codespell==$PIN"
          bash scripts/spell-check.sh

      - name: Local hygiene hooks
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pre-commit
          pre-commit --version
          pre-commit run --all-files || { echo "::error::failed step: pre-commit hooks (see .pre-commit-config.yaml)"; exit 1; }

  ## ── Text gates — reads text, so it does not sit on an arm64 runner ────────
  # AGENTS.md § Working here prices a lock by the seat it costs ("text gates go to ubuntu; arm64
  # minutes are the expensive seat"). These gates were the `audit` leg on macos-26: a 25-minute
  # ceiling measured at 715 s a push, most of it building the pinned swift-format and running
  # `swift package resolve`, neither of which a git/grep/python gate needs. Same scripts, same
  # verdicts, cheap seat.
  # The premise is pinned, not inherited: `OCOREAI_AGENTS_NO_HOST_REFS=1` judges the docs as a host
  # with no comparator trees, because on 10-28 that premise was what decided a P2 red — 25 cites had
  # drifted into dead pointers on a fresh clone while every check on a tree-rich host stayed green. A
  # gate whose premises come from the box it runs on is exactly what invariant 1 is about.
  # What did NOT come to CI, deliberately: the pinned swift-format build (no ubuntu image ships a
  # Swift toolchain, so moving it would invent an untested path) and the toolchain/Metal probe. Both
  # bite in `make push-ready` now, the cheapest rung that bites, on the host whose toolchain produced
  # the bytes; and R1 ("the shipping SDK carries no CoreAI") is judged where it is observable — the
  # artefact, by `release-artifact-check.sh delivery` in `build-appstore` — not by an environment ask.
  text-gates:
    name: "Text gates (ubuntu)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCOREAI_AGENTS_NO_HOST_REFS: "1"
    steps:
      - uses: actions/checkout@v4

      # The injected context layer is code: budget it (shrink-only), resolve every path it names,
      # re-run every `<!-- claim:... -->` number, and check the routing table against the guides on
      # disk. Its first run here caught three drifted counts and four map rows pointing at files the
      # repo never had, because nothing else in the fleet greps the docs.
      - name: AGENTS.md contract
        run: |
          bash scripts/agents-md-contract.sh check \
            || { echo "::error::failed step: AGENTS.md contract (docs gate)"; exit 1; }

      # Zero try!/as!/fatalError/assert, print() only on a CLI surface, and the Class-I licence
      # patterns that travel with the binary (AGENTS.md § Build / Test / Lint).
      - name: Code-pattern audit
        run: |
          bash scripts/audit.swift_patterns.sh \
            || { echo "::error::failed step: static audit (code patterns)"; exit 1; }

      # docs-check asks whether `file:line` is inside the file; this asks whether the line is the
      # code the doc claims. 15 cites were wrong on 10-17 with docs-check green. Local cites are
      # enforced (floor 6); upstream ones report as skipped where no dependency tree exists, so a
      # host with neither ~/references nor checkouts neither false-fails nor passes silently.
      - name: Line-cite anchors
        run: |
          bash scripts/anchor-check.sh \
            || { echo "::error::failed step: line-cite anchors"; exit 1; }

      # xcodebuild reads the WORKSPACE copy, swift build reads the ROOT one; they drifted for three
      # pin bumps and only this check ever said so.
      - name: Resolved lockfiles in sync
        run: |
          bash scripts/resolved-sync.sh check \
            || { echo "::error::failed step: resolved lockfile sync"; exit 1; }

      # A dead type name in the architecture docs teaches an architecture that does not exist:
      # ARCHITECTURE.md diagrammed BackendProtocol.swift for weeks after 2123143 deleted it.
      - name: Docs name only types that exist
        run: |
          bash scripts/docs-type-existence.sh \
            || { echo "::error::failed step: doc type existence"; exit 1; }

      # A remediation target that cannot parse is a gate with no exit (`make format` once died on an
      # apostrophe inside an awk program, so the stated fix for a red had never run).
      - name: Every Makefile recipe parses
        run: |
          bash scripts/makefile-parse-check.sh \
            || { echo "::error::failed step: makefile parse"; exit 1; }

      # No secret scanner in CI, and that is a measurement, not a preference. It was imported from
      # `references/zeroclaw` — a project not in references and never in this repo's history — and
      # 0 of the 20 reference projects run one in CI. Its own record: never green (it trips our
      # fabricated-key fixtures), it walked `.build` (5.1 GB of other projects' fixtures, which is
      # where the job's minutes went), and its PR branch handed `git diff` output to `--source`,
      # a path, so no PR was ever scanned while the step printed clean. Credential detection with
      # maintained signatures is free where it also lands before history: GitHub secret scanning +
      # push protection for this public repo, which the owner enables under Settings → Code security.


  ## ── Build + test via xcodebuild (mlx-swift-lm pattern) ──
  # xcodebuild handles Metal shader compilation natively (resolves metallib).
  # mlx-swift-lm CI uses: xcodebuild build-for-testing → xcrun xctest.
  # This avoids the swift test metallib path issue entirely.
  build-and-test:
    name: "Build & Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # No `needs:` on audit, deliberately: AGENTS.md names this leg the authority,
    # and an authority that a formatter install can cancel is not an authority.
    # Measured cost of the old coupling — every leg sat `skipped` for ~90 pushes
    # while a style-tool version assert failed.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            build_release: true
          - os: xcode-27
            build_release: true
    steps:
      - uses: actions/checkout@v4

      # SPM dependency cache — repos only, not build output (avoid stale artifacts)
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/repositories
            .build/checkouts
          key: spm-deps-${{ matrix.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-deps-${{ matrix.os }}-

      # build-for-testing BUILDS the test product — it does NOT execute tests.
      # The "Run tests (xcrun xctest)" step below is the actual test gate
      # (upstream-aligned: mlx-swift-lm PR track = build-for-testing → xcrun xctest).
      # xcode-27: requires MetalToolchain — install before build

      - name: Install MetalToolchain (xcode-27)
        if: ${{ matrix.os == 'xcode-27' }}
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Build for testing (xcodebuild)
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          xcodebuild build-for-testing \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreaiTests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES
        env:
          OCOREAI_BUILD: ci

      # build-for-testing only compiles the test bundle. Tests must be
      # EXECUTED in a dedicated step — `TEST BUILD SUCCEEDED` does NOT mean
      # tests ran. This is the real test gate (757 Swift Testing tests).
      # The count is reported by the run (scripts/test-verdict.sh), not frozen in this comment:
      # the frozen one above was unreadable for a fortnight because the annotation that carried
      # it ends at its first newline, so nothing here proved the suite executed.
      - name: Run tests (xcrun xctest)
        run: |
          set -euo pipefail
          XCB=$(ls -dt ~/Library/Developer/Xcode/DerivedData/ocoreai-*/Build/Products/Debug/ocoreaiTests.xctest 2>/dev/null | head -1 || true)
          [ -n "$XCB" ] || { echo "❌ ocoreaiTests.xctest not found in DerivedData"; exit 1; }
          echo "Running test bundle: $XCB"
          # A red leg nobody can read is a red leg nobody fixes: both matrix legs sat on this
          # step's bare `exit 1` for a fortnight. Publish what failed, in the one place readable
          # without a token (`/check-runs/{id}/annotations`), and name the documented way this
          # command can exit non-zero while reporting no test results at all.
          set +e
          xcrun xctest "$XCB" 2>&1 | tee xctest.log
          RC=${PIPESTATUS[0]}
          set -e
          if grep -q "Failed to load the default metallib" xctest.log; then
            echo "::error::MLX found no shader payload — the run dies at the first Metal allocation and reports no summary (docs/agent/build-gate-reality.md)"
          fi
          # Ask each framework separately, and floor the answer: XCTest's "Executed 0 tests"
          # is what this bundle prints on every green run (Tests/ holds no XCTestCase file),
          # so it settled nothing, and an exit code of 0 with no swift-testing summary is not
          # a pass. One verdict per line, because a workflow command ends at its first newline.
          VERDICT_RC=0
          bash scripts/test-verdict.sh xctest.log || VERDICT_RC=$?
          if [ "$RC" -eq 0 ] && [ "$VERDICT_RC" -ne 0 ]; then
            echo "::error::xctest exited 0 without delivering a verdict — this step judged nothing (see the two notices above)"
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            # Name the failing cases, not the prose: the first version of this grep matched
            # `' failed` and published an FM-tool warning as if it were a test result, while
            # the other matrix leg published nothing at all. `Test Case ...] failed` is the
            # XCTest line; anything else is a crash, and a crash says so instead of staying quiet.
            CASES=$(grep -E "^Test Case .*\] failed|failed after .* with .* issue|✘ |Fatal error|^EVIDENCE " xctest.log | head -20 || true)
            { echo "### xctest failures (exit $RC)"; echo '```'
              grep -E "failed|Fatal error|error:" xctest.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$CASES" ]; then
              printf '%s\n' "$CASES" | sed 's/^/::error::failing case: /'
            else
              echo "::error::xctest exited $RC with no failure line at all — the bundle died before reporting (crash, timeout, or no metallib). $(wc -l < xctest.log) log line(s), tail:"
              tail -12 xctest.log | sed 's/^/::error::  /'
            fi
            exit "$RC"
          fi
          echo "✅ xctest exit 0"

      # ── Headless serve smoke — the 10-08 fc28cc8 contract ──
      # 'serve' must boot the bridge on 127.0.0.1:8080 in a SESSION WITH NO
      # FOREGROUND GUI (the exact condition that silently never bound before
      # HeadlessServer existed) and SIGTERM must exit 0 after draining.
      # Models are lazy — no weights downloaded; full inference E2E is
      # smoke-tested against the release DMG by the maintainer, not here.
      # Bounded on purpose. Measured 10-28: this step ran 2545-2850 s on six consecutive pushes
      # (under 20 s on the last green run of the same leg), and the leg's only verdict was
      # `cancelled` at the job's own 60-minute limit — a step that overruns decides the job's
      # verdict by timing out. 10 min is about 5x the measured cost of what runs here (three
      # live probes plus boot and drain), and a step that times out names itself in the job's
      # step list, which is the diagnosis a job-level timeout never gives.
      - name: Headless serve smoke (macos-26)
        if: ${{ matrix.os == 'macos-26' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          BIN=$(find ~/Library/Developer/Xcode/DerivedData -name ocoreai -type f -path '*Debug*' 2>/dev/null | head -1)
          [ -n "$BIN" ] || { echo "❌ Debug binary not found in DerivedData"; exit 1; }
          echo "smoke binary: $BIN"
          "$BIN" serve >/tmp/serve_smoke.log 2>&1 &
          SPID=$!
          trap 'kill -TERM $SPID 2>/dev/null || true' EXIT
          OK=""
          # A wall-clock window: the poll costs its own curl deadline on top of the sleep, so
          # 30 iterations is up to 150 s, and the message below claimed 60 s for it.
          SERVE_START=$(date +%s)
          while [ $(( $(date +%s) - SERVE_START )) -lt 60 ]; do
            sleep 2
            if curl -sf -m 3 http://127.0.0.1:8080/health >/tmp/serve_health.json; then OK=1; break; fi
            kill -0 $SPID 2>/dev/null || { echo "❌ serve process died early"; cat /tmp/serve_smoke.log; exit 1; }
          done
          [ -n "$OK" ] || { echo "❌ /health not bound within 60s (waited $(( $(date +%s) - SERVE_START ))s)"; cat /tmp/serve_smoke.log; exit 1; }
          echo "✅ headless /health:"; head -c 200 /tmp/serve_health.json; echo
          kill -TERM $SPID
          for i in $(seq 1 20); do kill -0 $SPID 2>/dev/null || break; sleep 1; done
          if kill -0 $SPID 2>/dev/null; then echo "❌ SIGTERM ignored (still alive after 20s)"; kill -9 $SPID; exit 1; fi
          wait $SPID || RC=$?
          RC=${RC:-0}
          grep -q "headless serve starting" /tmp/serve_smoke.log || { echo "❌ no 'headless serve starting' marker in log"; exit 1; }
          grep -q "shut down complete" /tmp/serve_smoke.log || { echo "❌ no 'shut down complete' in log"; exit 1; }
          [ "$RC" -eq 0 ] || { echo "❌ SIGTERM exit code $RC (expected 0)"; exit 1; }
          echo "✅ headless serve: bound → SIGTERM → exit 0, drain complete"

          # Same binary, nothing resident. Three contract tiers, none of which needs weights:
          #   37 — the scripted engine through the real handlers: SSE framing, tool-call assembly,
          #        `usage`, the `engineBackend` honesty field.
          #   38 — §1: an unmeasured checkpoint is never refused for `reasoning_effort`, and
          #        `/v1/models` publishes `not_observed` instead of silence. §2 needs a checkpoint and
          #        prints its own skip note on a host that has none.
          #   39 — executes skills/ocoreai/SKILL.md, the artefact another harness reads to drive /v1,
          #        marker by marker, so the published skill cannot drift from the served wire.
          # They sit in this step instead of opening a leg because a gate nobody watches goes red is
          # decoration, and CI is the only seat that runs on every push.
          #
          # Bounded, and loud about the bound. The readiness budget now costs what it says: probe_boot
          # counted loop iterations, each one the poll's 3 s curl deadline plus a 1 s sleep, so a
          # "75 s" window spent ~285 s wall (measured locally — a 10 s budget against a server that
          # accepts and never answered cost 38 s) and three probes overran the 600 s bound that names
          # them. Five runs on 10-28 measured this step at 2545-2850 s at the 240 s default until the
          # job's own 60-minute limit cancelled the authority leg, and a cancelled leg prints its
          # reason nowhere. 40 s per boot is ~25x what these probes take where the server binds, and
          # OCOREAI_PROBE_CURL_TIMEOUT=60 bounds one hung request — the 180 s default exists for local
          # model loads and these probes download nothing. Each probe publishes its own elapsed time,
          # so the next overrun names the probe instead of the step, and a failure publishes the
          # probe's words, because a red that needs a token to read is a rumour and the reader whose
          # action changes is whoever waits on this leg to tag: they learn in one minute whether the
          # wire broke or the runner could not boot a server.
          export OCOREAI_READY_TIMEOUT=40 OCOREAI_PROBE_CURL_TIMEOUT=60
          SMOKE_RC=0
          for PROBE_NO in 37 38 39; do
            PROBE_START=$(date +%s)
            PROBE_RC=0
            OCOREAI_BIN="$BIN" bash scripts/probes/run.sh "$PROBE_NO" > "probe-$PROBE_NO.log" 2>&1 || PROBE_RC=$?
            PROBE_ELAPSED=$(( $(date +%s) - PROBE_START ))
            echo "::notice::probe $PROBE_NO exit $PROBE_RC after ${PROBE_ELAPSED}s"
            if [ "$PROBE_RC" -eq 0 ]; then
              grep -E "passed,|✘" "probe-$PROBE_NO.log" | tail -2
            else
              SMOKE_RC=1
              echo "::error::probe $PROBE_NO failed after ${PROBE_ELAPSED}s (40 s readiness budget per boot attempt) — log tail:"
              tail -20 "probe-$PROBE_NO.log" | sed 's/^/::error::  /'
              { echo "### probe $PROBE_NO failed"; echo '```'
                grep -E "FAIL|NOTE  bridge|server exited|refusing to start|never answered|Fatal error" \
                  "probe-$PROBE_NO.log" | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          kill -TERM $SPID 2>/dev/null || true
          [ "$SMOKE_RC" -eq 0 ] || exit 1

      # ── Release build via xcodebuild ──
      - name: Build (xcodebuild, Release)
        if: ${{ matrix.build_release == true }}
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          xcodebuild build \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreai \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES
        env:
          OCOREAI_BUILD: ci

      - name: Collect artifacts (Release)
        if: ${{ matrix.build_release == true && always() }}
        run: |
          set -euo pipefail
          DD=~/Library/Developer/Xcode/DerivedData/ocoreai-*/Build/Products
          PRODUCT_DIR=$(find "$DD" -path '*/Release*' -type d 2>/dev/null | head -1)
          if [ -z "$PRODUCT_DIR" ]; then
            echo "🔍 Scanning DerivedData for release products..."
            PRODUCT_DIR=$(find "$DD" -name 'ocoreai' -type f 2>/dev/null | head -1 | xargs dirname)
          fi
          echo "PRODUCT_DIR=$PRODUCT_DIR"
          mkdir -p .artifacts/release
          [ -f "$PRODUCT_DIR/ocoreai" ] && cp "$PRODUCT_DIR/ocoreai" .artifacts/release/
          [ -d "$PRODUCT_DIR/mlx-swift_Cmlx.bundle" ] && cp -R "$PRODUCT_DIR/mlx-swift_Cmlx.bundle" .artifacts/release/
          ls -la .artifacts/release/
        continue-on-error: true

      - name: Upload build artifacts
        if: ${{ matrix.build_release == true && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ocoreai-binary-${{ matrix.os }}
          path: .artifacts/release/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: warn
          retention-days: 7

  ## ── Release — 开箱即用产物 (tag 触发) ─────────────────────────────
  # 第一性: 用户装 ocoreai 必须 ≤ 双击。v* tag → DMG + GitHub Release。
  # 本地已实证的脚本链: build-app.sh (release + metallib + icon) → build-dmg.sh
  # (hdiutil 打包 + 挂载自验)。签名: 提供 OCOREAI_SIGN_IDENTITY 即正式签名,
  # 否则 ad-hoc (本地可运行, 首启需右键放行 — 文档已注明)。
  release:
    name: "Release DMG (${{ github.ref_name }})"
    runs-on: macos-26
    timeout-minutes: 90
    needs: [build-and-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Materialize mlx metallib (xcodebuild — SwiftPM does NOT compile .metal)
        # Root cause of the 09-27 release-leg failure: `swift build --traits appStore`
        # (build-app.sh) links fine (382/382) but never emits the Metal shader
        # library — .metal sources are a Xcode-project target (mlx-swift_Cmlx),
        # and CI logs show 0 metal steps under SwiftPM. Local builds only "worked"
        # because a stale xcodebuild product (DerivedData/out, 09-23) was present;
        # a clean runner has none → build-app.sh guard: "default.metallib not found".
        # Fix: run the proven xcodebuild path (same as build-and-test leg — CI log
        # 2026-09-27T03:25:28 MetalLink default.metallib, 9 kernels), then place the
        # metallib at build-app.sh's FIRST candidate path so the guard passes.
        # The metallib is trait-independent (pure Metal shaders, shared by all
        # Swift targets), so a default-trait xcodebuild product is valid for the
        # appStore-trait release binary.
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          # Resolve first so .build/checkouts is populated (xcodebuild needs it).
          swift package resolve
          xcodebuild build \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreai \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES
          METAL=$(ls -dt ~/Library/Developer/Xcode/DerivedData/ocoreai-*/Build/Products/*/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib 2>/dev/null | head -1 || true)
          if [ -z "$METAL" ] || [ ! -f "$METAL" ]; then
            echo "❌ xcodebuild did not produce default.metallib"; exit 1
          fi
          echo "   metallib produced: $METAL ($(du -h "$METAL" | awk '{print $1}'))"
          MDEST=".build/out/Products/Release/mlx-swift_Cmlx.bundle/Contents/Resources"
          mkdir -p "$MDEST"
          cp "$METAL" "$MDEST/default.metallib"
          echo "✅ Metallib staged at build-app.sh candidate path: $MDEST/default.metallib"

      - name: Build DMG (appStore trait — App Store 审核面)
        run: |
          set -euo pipefail
          export OCOREAI_VERSION="$(echo "${GITHUB_REF_NAME#v}")"
          bash scripts/build-dmg.sh

      - name: GUI proof — the built .app must SHOW a rendered window
        # Invariant 2 applied to the product surface: "it built" is not "the user sees a
        # window". verify-gui-window.sh asserts a layer-0 window of believable size plus a
        # distinct-colour floor on the captured frame (measured locally 10-22: 900x472,
        # 140 KB, 846 distinct colours). No model here on purpose: the model-dependent half
        # (a real completion through the bridge) is scripts/e2e-gui-app.sh, measured locally,
        # and a ~1.5 GB download must never gate a release.
        run: |
          set -euo pipefail
          OCOREAI_ENABLE_HTTP=1 open build/ocoreai.app
          sleep 20
          SHOT=1 PNG=/tmp/ocoreai-window.png bash scripts/verify-gui-window.sh
          pkill -x ocoreai || true

      - name: Upload the window screenshot
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: ocoreai-window-${{ github.ref_name }}
          path: /tmp/ocoreai-window.png

      - name: Upload DMG to job artifact
        # NON-BLOCKING by evidence (2026-10-11): v0.1.12 attempts 1+2 BOTH
        # died exactly here — annotation: "Failed to CreateArtifact: Failed to
        # make request after 5 attempts: Request timeout:
        # /twirp/github.actions.results.api.v1.ArtifactService/CreateArtifact"
        # (GitHub capacity event; the action already retried 5× internally —
        # retrying the step re-enters the same down backend). This artifact
        # is a convenience copy; the DELIVERABLE is the Release asset, which
        # the next step uploads via a different path (uploads.github.com).
        # Losing the convenience copy must never block the deliverable.
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ocoreai-dmg
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "dist/ocoreai-${VER}.dmg" | awk '{print $1}')
          SIZE=$(stat -f%z "dist/ocoreai-${VER}.dmg")
          # The note is the first thing a stranger reads about a build of this project, so it is
          # English-first (the repo's own rule: one Chinese file, README.zh.md) and states only what
          # the artefact is — ad-hoc signed, not notarised, models fetched inside the app.
          NOTE="ocoreai v${VER} — an agent for open models, natively local on Apple silicon.

          One binary, offline, no API key: screen, camera, speech and the coding loop behind one
          OpenAI-compatible wire.

          Install: open the DMG, drag ocoreai into Applications, launch. Models are downloaded on first
          run from the in-app list — nothing is fetched before you choose.

          Signed ad-hoc, not notarised: if Gatekeeper refuses the first launch, right-click
          ocoreai in Applications and choose Open (once).

          SHA-256: ${SHA}
          Size: ${SIZE} bytes — verify: shasum -a 256 ocoreai-${VER}.dmg"
          # Split ceremony: create release (metadata only, cheap/idempotent),
          # then upload the asset with its own retry loop. Asset upload goes to
          # uploads.github.com — NOT the ArtifactService twirp API that killed
          # v0.1.12 attempts 1+2. Failure recovery is state-probed, never
          # exit-code-trusted (v0.1.9 run 38052349970 lesson).
          gh release view "v${VER}" >/dev/null 2>&1 \
            || gh release create "v${VER}" \
                 --title "ocoreai v${VER} (macOS)" \
                 --notes "${NOTE}" \
                 --target main
          if ! gh release view "v${VER}" --json assets -q '.assets[].name' | grep -q "ocoreai-${VER}.dmg"; then
            UPLOADED=""
            for i in 1 2 3; do
              if gh release upload "v${VER}" "dist/ocoreai-${VER}.dmg" --clobber; then UPLOADED=1; break; fi
              echo "asset upload attempt $i failed — retry in $((i*20))s"; sleep $((i*20))
            done
            [ -n "$UPLOADED" ] || { echo "::error::asset upload failed after 3 attempts (re-run this job or upload manually: dist/ocoreai-${VER}.dmg)"; exit 1; }
          fi
          gh release view "v${VER}" --json assets -q '.assets[].name' | grep -q "ocoreai-${VER}.dmg" \
            || { echo "::error::release $VER genuinely lacks its DMG asset — this is a real failure"; exit 1; }
          echo "::notice::release + asset confirmed present (state probe, not ceremony)"

      - name: Read-back verify (published asset integrity loop)
        # First-principles: 'uploaded' ≠ 'downloadable intact'. Fetch the
        # published asset back from GitHub's CDN and assert sha256 parity
        # against the local build — truncation or corruption must fail the
        # release here, not surface as 'image not recognized' on a user's
        # machine (v0.1.5 audit surfaced the missing loop).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VER}/ocoreai-${VER}.dmg"
          LOCAL_SHA=$(shasum -a 256 "dist/ocoreai-${VER}.dmg" | awk '{print $1}')
          curl -fL --retry 3 --retry-delay 5 --max-time 600 -o /tmp/readback.dmg "$URL"
          RB_SHA=$(shasum -a 256 /tmp/readback.dmg | awk '{print $1}')
          RB_SIZE=$(stat -f%z /tmp/readback.dmg)
          LB_SIZE=$(stat -f%z "dist/ocoreai-${VER}.dmg")
          if [ "$RB_SHA" != "$LOCAL_SHA" ] || [ "$RB_SIZE" != "$LB_SIZE" ]; then
            echo "❌ asset mismatch — readback sha=$RB_SHA size=$RB_SIZE vs local sha=$LOCAL_SHA size=$LB_SIZE"
            exit 1
          fi
          echo "✅ read-back parity — sha256=$RB_SHA size=$RB_SIZE"
          rm -f /tmp/readback.dmg

  ## ── App Store trait build gate ───────────────────────────────
  # `--traits appStore` EXCLUDES the default traits (FoundationModels
  # Integration off), so every FM-adapter code path must be trait-gated.
  # A block that only checks `#if canImport(CoreAI)` — but references
  # trait-gated symbols (MLXLanguageModel / FoundationModels) — compiles
  # under the default trait set and FAILS under appStore. The
  # build-and-test legs above compile the default trait set only, which is
  # why this class of error stayed hidden until build-app.sh was run
  # locally (2026-09-17). This leg is the compile gate for the appStore
  # / build-app.sh delivery path.
  build-appstore:
    name: "App Store trait compile (macOS 26)"
    runs-on: macos-26
    timeout-minutes: 40
    # Independent of the style gate: compile validation outranks style.
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/repositories
            .build/checkouts
          key: spm-deps-macos-26-appstore-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-deps-macos-26-

      # The same route and the same first two steps scripts/build-app.sh runs, so this leg judges the
      # shape the DMG ships rather than the shape the runner's newest SDK happens to carry. Measured
      # 10-28: an ungated use of a `#if canImport(CoreAI)` member compiled green on an SDK-27 host and
      # broke the delivery build (EnginePool.swift called LoadedModel.isCoreAIAsset outside the gate);
      # `swift build` alone could not see it, because on that host the member exists. The route comes
      # from scripts/toolchain-contract.sh (one home) and the verdict comes from the artefact.
      # No metallib is needed at build time (MLX resolves it at runtime — see scripts/build-app.sh).
      # A *compiler* is, and the leg's first runner reds were exactly that: `unable to spawn process
      # 'metal'` while llbuild ran CompileMetalFile on Cmlx's steel_attention.metal. Two causes, both
      # measured 10-28 and both fixed. (a) The component is not preinstalled on the image, so the step
      # below downloads it — the xcode-27 cell above installs it for the same reason. (b) The route
      # emitted no PATH rung anyway, because its resolver only ever *globbed* for a mount cryptexd
      # attaches on demand and had just been asked to create: the leg's own notice read `metal=ABSENT`
      # while the same resolver named a mount one second later. Asking is what mounts it, and the
      # resolver now asks — entry 10-28(20). The route stays CLT on purpose: an SDK-27 route would
      # compile the CoreAI blocks into the artefact that ships.
      - name: Install MetalToolchain (the CLT route has no metal compiler)
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Build + judge the delivery shape (release, --traits appStore)
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          # Failures must be VISIBLE without a token — the same contract build-ios below honours. The
          # resolver's words, the compiler's error lines and the checker's verdict go to
          # $GITHUB_STEP_SUMMARY and ::error:: annotations, which the public check-runs/{id}/annotations
          # endpoint serves. This leg's first runner verdict on the pinned route (10-28) was readable
          # only as "Process completed with exit code 1": a red that nobody without a token can read is
          # not a gate, it is a rumour.
          if ! ROUTE="$(bash scripts/toolchain-contract.sh print-delivery-env 2>&1)"; then
            printf '%s\n' "$ROUTE" | tail -20 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::the delivery route refused on this runner — step summary has the words"
            exit 1
          fi
          eval "$ROUTE"
          # The route owns the PATH rung (one home); this asks whether it landed on a real compiler, and
          # says so in the one place readable without a token. Cmlx compiles `.metal` sources, so no
          # compiler means no build: finding that out in the first second beats finding it out at
          # CompileMetalFile, and beats a bare `unable to spawn process 'metal'` outright — the three
          # probes below distinguish the component never installing, installing where the resolver does
          # not look, and installing without cryptexd mounting it. Measured 10-28: the download step went
          # green and the build still died on that line, so which of the three it is has to be printed.
          METAL_WHERE="$(command -v metal || true)"
          echo "::notice::delivery route: DEVELOPER_DIR=${DEVELOPER_DIR:-unset} SDKROOT=${SDKROOT:-unset} metal=${METAL_WHERE:-ABSENT}"
          if [ -z "$METAL_WHERE" ]; then
            COMP="$(bash scripts/toolchain-contract.sh report 2>&1 | grep -E '^(metal|metal_component_status|metal_cryptex_bin)=' | tr '\n' ' ' || true)"
            CRYPTEX="$(ls -d /private/var/run/com.apple.security.cryptexd/mnt/com.apple.MobileAsset.MetalToolchain-v*/Metal.xctoolchain 2>/dev/null | tr '\n' ' ' || true)"
            RESOLVED="$(bash scripts/toolchain-contract.sh print-metal-bin 2>&1 | tail -1 || true)"
            {
              echo "::error::no metal on PATH — the delivery route exports a PATH rung only when its resolver finds one"
              echo "::error::resolver verdict: ${COMP:-the contract printed no metal facts}"
              echo "::error::cryptex mount: ${CRYPTEX:-no com.apple.MobileAsset.MetalToolchain mount listed}"
              echo "::error::resolver print-metal-bin: ${RESOLVED:-empty — add the rung this runner needs to cryptex_metal_bin}"
            }
            { echo "### delivery route has no Metal compiler"; echo '```'
              echo "metal=ABSENT"; echo "contract=${COMP:-none}"; echo "cryptex=${CRYPTEX:-none}"
              echo "resolver=${RESOLVED:-empty}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! { swift build -c release --traits appStore $OCOREAI_DELIVERY_FLAGS \
                 && bash scripts/release-artifact-check.sh delivery .build/release/ocoreai ; } \
               > appstore-delivery.log 2>&1; then
            grep -E "error:|no CoreAI-free|has no member|❌" appstore-delivery.log | sort -u | head -30 \
              | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E "error:" appstore-delivery.log | sort -u | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "--- last lines ---"
            tail -25 appstore-delivery.log
            exit 65
          fi
          tail -4 appstore-delivery.log

  ## ── iOS compile-validation (independent job — no matrix sharing) ──
  # ocoreai declares .iOS(.v17) first-class; the #if os(iOS) branches had no CI
  # compile gate. Build-only on the macos-26 runner (Mac runners ship the iOS
  # SDK) — macOS legs above remain the full build+test gate; the test target
  # links macOS-only frameworks and cannot xctest on iOS.
  build-ios:
    name: "macOS 26 · iOS compile-only"
    runs-on: macos-26
    timeout-minutes: 60
    # Independent of the style gate: compile validation outranks style.
    steps:
      - uses: actions/checkout@v4

      # Shared SPM checkout cache with the macOS legs (restore hit speeds first build)
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/repositories
            .build/checkouts
          key: spm-deps-macos-26-ios-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-deps-macos-26-

      - name: Build for iOS (generic — no simulator needed for compile validation)
        run: |
          set -euo pipefail
          export SWIFTC_SCAN_FOR_DEPS=0
          # Failures must be VISIBLE without auth: xcodebuild's real error
          # lines go to $GITHUB_STEP_SUMMARY + ::error:: annotations
          # (readable via public /check-runs/{id}/annotations).
          if ! xcodebuild build \
            -workspace ocoreai.xcworkspace \
            -scheme ocoreai \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation > ios-build.log 2>&1; then
            echo "## iOS build errors" >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|Could not resolve|fatal" ios-build.log | sort -u | head -30 | tee -a "$GITHUB_STEP_SUMMARY"
            grep -E "error:" ios-build.log | sort -u | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 65
          fi
        env:
          OCOREAI_BUILD: ci


  ## ── (legacy tar.gz release removed 09-27 — superseded by DMG release job above;
  ##     nothing needed it: no iOS/legacy consumer, and job id 'release' conflicted)
