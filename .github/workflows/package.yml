name: Package dry-run

# The launch path, run without a launch.
#
# ### Why this lane exists (measured, 10-29)
# `git ls-remote --tags origin` is empty and `/releases` is `[]`: the tree has never shipped, and the
# job that would ship it has never run end to end — it is gated on `refs/tags/v*`, so the only way to
# exercise it is the thing it exists to do. It has died there before, on steps that have nothing to
# do with the code: no Metal shader payload on a clean runner (09-27, "default.metallib not found")
# and the artefact-upload API (v0.1.12, twice). That is the third kill criterion in
# `docs/agent/long-horizon-goal.md` in its plainest form — a launch nobody can rehearse.
#
# So the *build* half of the release leg runs here, on every packaging change and every night, with no
# publish step and no write token (`permissions: contents: read`: it cannot create a release even if a
# step tried). `docs/agent/competitor-iteration-paths.md` § The release cadence rule names this split
# as the precondition for self-serve publishing; the tag day then runs a publish step whose build
# already went green on the same script the day before.
#
# ### Why not every push
# This leg is ~25 arm64 minutes (an xcodebuild Release build is most of it), and the repo's own rule
# prices arm64 minutes as the expensive seat. Packaging inputs trigger it immediately; everything else
# is covered by the nightly, which is how the tree that owns this shape does it — mlx-swift-lm
# .github/workflows/integration_tests.yml:3-4: "Heavy integration tests … Kept out of the PR path so
# they never block merges", off-hour cron at :17 because GitHub queues :00 schedules behind everyone's.
# The worst-case staleness of the packaging verdict is therefore one day for a code change and zero for
# a change to the packaging chain itself.
#
# ### What it does NOT do
# It never publishes, never uploads to a release, and never touches a tag. It is a rehearsal.
#
# ### A red here is not advisory
# `scripts/ci-status.sh` counts this job, so a failure here stops a tag — deliberately. A rehearsal that
# cannot stop the launch it rehearses is decoration: the claim being tested is "the .dmg we would publish
# serves", and if that is false on the night, publishing it the next morning is the exact failure mode.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package.yml'
      - 'scripts/build-app.sh'
      - 'scripts/build-dmg.sh'
      - 'scripts/resolve-metallib.sh'
      - 'scripts/release-artifact-check.sh'
      - 'scripts/toolchain-contract.sh'
      - 'scripts/verify-gui-window.sh'
      - 'scripts/version.sh'
      - 'scripts/probes/41-artifact-dmg-serves.sh'
      - 'Resources/**'
      - 'ocoreai.xcworkspace/**'
      - '**/*.metal'
      - 'Package.swift'
      - 'Package.resolved'
  schedule:
    - cron: '37 9 * * *'

permissions:
  contents: read

# Ref-independent group, cancel-in-progress false: mlx-swift-lm integration_tests.yml:22-27. A nightly
# that is mid-build must not be thrown away by a push that lands while it runs, and two packaging runs
# on the same lane would race nothing but the queue anyway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  package-dryrun:
    name: "DMG from a clean runner (no publish)"
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The same step `build-and-test` and `build-appstore` run, with this lane's key and theirs as a
      # restore source. Without it this leg resolves every dependency from zero inside the metallib step —
      # measured on two runs of near-identical inputs at 777 s and 969 s for that one step, which is the
      # shape of work a dependency cache exists to remove. Nothing is asserted here; it is minutes.
      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/org.swift.swiftpm/repositories
            .build/checkouts
          key: spm-deps-macos-26-package-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            spm-deps-macos-26-

      - name: Install MetalToolchain (the CLT route has no metal compiler)
        # Same premise build-appstore had to buy on 10-28: the component is not preinstalled, and
        # Cmlx's .metal sources need a real compiler. The release leg above still carries its own
        # copy of this chain; package.yml runs it first, so a regression here is found on main.
        run: xcodebuild -downloadComponent MetalToolchain

        # No metallib step in this lane, and that is a measurement rather than an oversight: on 10-29 the
        # appStore leg printed `rung: swiftpm-product · 2 389 928 bytes` at the SwiftPM product path with no
        # xcodebuild anywhere in the job and nothing metallib in the cache paths, so SwiftPM does compile
        # `.metal` once a metal compiler exists — which build-app.sh arranges itself by evaluating
        # `toolchain-contract.sh print-delivery-env` when SDKROOT is unset. What catches a regression is not
        # a hope: build-app.sh exits 1 when no candidate carries the payload, and probe 41 §1 reds on a
        # bundle whose shipped library is missing or too small. The release leg still runs the script, and
        # stops when this lane has gone green without it — the minutes are the reason to rehearse here.
      - name: Build the DMG (the same script the release leg runs)
        run: |
          set -euo pipefail
          bash scripts/build-dmg.sh
          ls -l dist/

      - name: Judge the artefact — probe 41 (mount, serve, stop)
        timeout-minutes: 15
        # The version verdict is pinned here: scripts/version.sh prints the number the next tag must
        # carry, so this step says out loud, on a runner, what the artefact a stranger downloads
        # reports about itself.
        env:
          OCOREAI_READY_TIMEOUT: "90"
          OCOREAI_PROBE_CURL_TIMEOUT: "30"
        run: |
          set -uo pipefail
          # Absolute, because run.sh cds into scripts/probes before launching a probe: the first runner
          # pass of this step died in 1 s on a relative path it could no longer see.
          DMG="$PWD/$(ls -t dist/ocoreai-*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::build-dmg.sh produced no dist/ocoreai-*.dmg — nothing to judge"; exit 1; }
          # The version verdict is worth exactly what its expectation is worth. Taken from the same script
          # the build consulted, it can only catch plumbing; taken from a tag, it catches the lie that
          # matters — an artefact whose About box names a version nobody ever tagged. On an untagged tree the
          # honest expectation is version.sh's own last rung (0.0.0), and the step says which of the two ran.
          TAG_VER="$(git describe --tags --abbrev=0 2>/dev/null | tr -d 'v' || true)"
          if [ -n "$TAG_VER" ]; then EXPECTED="$TAG_VER"; SRC="tag v$TAG_VER"; else EXPECTED="0.0.0"; SRC="no tag — plumbing check only"; fi
          { echo "### package dry-run artefact"; echo '```'
            echo "dmg=$DMG bytes=$(wc -c < "$DMG" | tr -d ' ')"
            echo "version=$EXPECTED (expected from: $SRC)"
            shasum -a 256 "$DMG" | awk '{print "sha256="$1}'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # A verdict publishes its own words — the contract scripts/probes/ci-step.sh keeps, and why a
          # red whose log sits behind a token is a rumour. This lane cannot call ci-step.sh (it points at
          # a smoke binary, and here the subject is an artefact), so the words are republished by hand.
          RC=0
          echo "::notice::artefact version verdict — expected $EXPECTED ($SRC)"
          OCOREAI_ARTIFACT_DMG="$DMG" \
          OCOREAI_ARTIFACT_VERSION="$EXPECTED" \
            bash scripts/probes/run.sh 41 > probe41.log 2>&1 || RC=$?
          VERDICT="$(grep -E 'passed, [0-9]+ failed' probe41.log | tail -1 | tr -d '\r')"
          if [ "$RC" -ne 0 ]; then
            tail -25 probe41.log | sed 's/^/::error::  /'
            echo "::error::probe 41 exited $RC against the artefact — ${VERDICT:-no summary line printed}"
            exit "$RC"
          fi
          echo "::notice::probe 41 verdict: ${VERDICT:-exited 0 and printed no summary line}"

      - name: Upload the DMG (rehearsal copy, non-blocking)
        # Non-blocking by the evidence that made the release leg's copy advisory: the ArtifactService
        # timeouts that killed v0.1.12 attempts 1+2 were an upload of this same kind of file.
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: ocoreai-dmg-dryrun
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 7

      - name: Window proof — the built app must SHOW a window
        # Blocks as of 10-29 because the premise it used to hedge is measured, not assumed: this lane's first
        # green pass printed `window proof GREEN on this runner`, so a GitHub macOS runner does have a window
        # session and a bundle that builds, signs and serves but renders nothing is a red worth having. The
        # script's own reds are the sampled ones — no layer-0 window of believable size, or a captured frame
        # under the distinct-colour floor (a surface that has size but renders nothing).

        run: |
          set -euo pipefail
          OCOREAI_ENABLE_HTTP=1 open build/ocoreai.app
          sleep 20
          SHOT=1 PNG=/tmp/ocoreai-window.png bash scripts/verify-gui-window.sh
          pkill -x ocoreai || true

      - name: Upload the window screenshot
        uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: ocoreai-window-dryrun
          path: /tmp/ocoreai-window.png
