# Local hygiene hooks: the layer every project this repo learns from ships (mlx-swift-lm,
# coreai-models, vllm, sglang, codex) and this repo did not. Two rules decide membership here:
# the check must need nothing but the checkout — no pinned toolchain, no Metal, no model — and it
# must have bitten. So swift-format stays in `make push-ready`, where the pinned build is resolved.
# Codespell left 11-24 (owner gate review): `make spell` and the CI governance step run the same
# tool on the same .codespellrc with the pin asserted in one home (scripts/spell-check.sh), and a
# second pin in a hook `rev:` is exactly the split that cost ~90 runs when swift-format drifted.
#
# `detect-private-key` is the whole secret story this repo needs: sglang gates secrets with exactly
# this hook rather than a scanner job, so a credential stops where it is typed, at zero CI minutes
# (why the old gitleaks job was deleted: CHANGELOG.md, `secret-gate-never-green`).
#
# Opt in:  make install-hooks   (not `make hooks`: a directory shadows that name — Makefile)
# Run all:  pre-commit run --all-files
# CI:      the ubuntu governance job runs `pre-commit run --all-files` (verifies this file and its
#          clean state without spending an arm64 minute).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
